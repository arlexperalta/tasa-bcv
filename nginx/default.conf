# Config del contenedor tasa-landing (nginx:alpine) en Contabo.
# Vive montada desde /opt/tasa-nginx/default.conf (ro).
# El no-cache del index hace que cada deploy llegue al teléfono de una:
# el navegador revalida siempre (ETag) y solo baja el archivo si cambió.

# Caché del proxy de USDT. Va aquí (fuera de server) porque nginx.conf incluye
# conf.d/*.conf dentro de http{}.
proxy_cache_path /var/cache/nginx/usdt levels=1:2 keys_zone=usdt:1m max_size=8m inactive=1h use_temp_path=off;
# Caché de la página del BCV (fecha-valor + tasas). inactive largo: si el BCV se
# cae un fin de semana, la última buena sigue sirviendo.
proxy_cache_path /var/cache/nginx/bcv levels=1:2 keys_zone=bcv:1m max_size=16m inactive=72h use_temp_path=off;

# ---- micro-encuesta de uso (29-ago-2026) ------------------------------------
# NO hay ningún proceso escuchando en este sitio: nginx sirve estático y proxea,
# y el colector es un cron que SALE a buscar, no un servidor que recibe. Montar
# un servicio para recoger 200 respuestas sería meterle una pieza más que
# vigilar —y que se puede caer— al único proyecto que funciona.
#
# Así que el endpoint no procesa nada: anota la línea en su propio log y
# contesta 204. El colector la ingiere a SQLite en su corrida horaria
# (collector/ingerir_encuesta.py). Ventaja que no es menor: esto no se puede
# caer, porque no hay código que ejecutar y la respuesta es siempre la misma.
log_format encuesta escape=json '$time_iso8601\t$args';

# Tope por IP. Va holgado A PROPÓSITO: en Venezuela las redes móviles salen por
# NAT del operador y muchísimos usuarios comparten una sola IP, así que un
# límite estrecho bloquearía gente real antes que a nadie más. Una persona
# honesta hace 3 peticiones en toda su vida (vista, respuesta, correo); esto
# frena a quien intente meter miles, que es lo único que envenenaría la muestra.
limit_req_zone $binary_remote_addr zone=enc:1m rate=60r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy de la tasa USDT (Binance P2P vía CriptoYa).
    # CriptoYa dejó de permitir fetch desde el navegador (CORS), pero sí responde
    # server-to-server. Al pedirla desde el propio dominio el CORS no aplica: la
    # llamada deja de ser cross-origin. La app pide /api/usdt, nginx la trae.
    location = /api/usdt {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;
        set $usdt_api "https://criptoya.com/api/binancep2p/USDT/VES/100";
        proxy_pass $usdt_api;

        proxy_set_header Host criptoya.com;
        proxy_set_header User-Agent "tasa.arlexperalta.com";
        proxy_set_header Accept "application/json";
        # Sin compresión upstream (2026-08-02). CriptoYa manda "Vary: Accept-Encoding"
        # y responde gzip o plano según lo que pida el cliente; abajo ignoramos Vary y
        # cacheamos todo bajo UNA sola clave. Resultado: la respuesta gzipeada de un
        # navegador y la plana de un cliente sin gzip se peleaban el mismo archivo de
        # caché, y quien leía a mitad de la sobreescritura recibía un cuerpo partido
        # (cabeza gzip + cola JSON). Del lado del usuario eso es "sin datos · actualiza"
        # en USDT sin razón aparente. Forzando plano hay una sola variante posible y la
        # clave única vuelve a ser correcta. Mismo motivo que en /api/bcv.
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Fallar rápido: la app ya sabe degradar cuando no hay tasa.
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        proxy_cache usdt;
        proxy_cache_key "usdt-ves-100";
        # CriptoYa responde "max-age=30, public, no-store": el no-store le prohíbe
        # cachear a nginx y cada visita pegaría a su API (que ya nos bloquea por IP).
        # Ignoramos sus headers y mandamos nosotros: 60s para una tasa es de sobra.
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        # Si la fuente cae, servir la última buena: el payload trae su propio
        # timestamp, así que la app muestra la hora real del dato, no una fresca falsa.
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;

        # El index se pide con cache:no-store; la tasa la cachea nginx, no el browser.
        add_header Cache-Control "no-store" always;
    }

    # Proxy de la página del BCV. Es la única fuente que publica la fecha-valor:
    # cada tarde hábil sale la tasa del día siguiente (el viernes, la del lunes).
    # dolarapi solo da "la última", sin distinguir vigente de próxima. La app
    # parsea el HTML (fecha-valor + USD + EUR) del lado del cliente.
    location = /api/bcv {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;
        set $bcv_api "https://www.bcv.org.ve/";
        proxy_pass $bcv_api;

        proxy_set_header Host www.bcv.org.ve;
        proxy_set_header User-Agent "tasa.arlexperalta.com";
        proxy_set_header Accept "text/html";
        # sin compresión upstream: nginx necesita el HTML plano para gzipearlo él
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_connect_timeout 8s;
        proxy_send_timeout 8s;
        proxy_read_timeout 10s;

        proxy_cache bcv;
        proxy_cache_key "bcv-home";
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        # ignore evita que nginx los honre; hide evita que lleguen al navegador
        # (el BCV manda max-age=300 que contradice nuestro no-store)
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        # 10 min: el BCV publica una vez al día; esto solo acota el retraso
        # con que los usuarios ven la tasa nueva de la tarde.
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;

        # la página pesa ~150 KB; comprimida baja a ~20
        gzip on;
        gzip_proxied any;

        add_header Cache-Control "no-store" always;
    }

    # Recibe una respuesta de la encuesta. Todo viaja en la query string porque
    # lo único que hace nginx aquí es registrar la línea: ev (vista/respuesta/
    # texto/correo/cerrada), la opción marcada, la posición en que salió y el
    # barajado completo de esa sesión. Nada que identifique a la persona salvo
    # lo que ella misma escriba.
    #
    # CUIDADO AL DESPLEGAR: /var/log/tasa tiene que existir DENTRO del contenedor
    # (bind mount desde el host, `mkdir -p /var/log/tasa` primero). Si nginx no
    # puede abrir su log, NO ARRANCA — y eso no es la encuesta caída, es el sitio
    # caído. Va a su propio directorio y no a /var/log/nginx para no montar
    # encima de los logs propios de nginx.
    location = /api/encuesta {
        # Sin limit_req_status: nginx solo acepta 400-599 ahí, y el código con
        # que se rechaza a un abusador da igual — el envío es fire-and-forget y
        # nadie lee la respuesta. Se queda el 503 por defecto.
        limit_req zone=enc burst=30 nodelay;
        access_log /var/log/tasa/encuesta.log encuesta;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # Histórico de la tasa, generado por collector/exportar.py. La base SQLite
    # vive fuera de la raíz web (/opt/tasa-historico) y no se publica; lo que
    # sale es este JSON. 30 min de caché: se regenera una vez por hora.
    location = /historico.json {
        add_header Cache-Control "public, max-age=1800";
        gzip on;
        gzip_types application/json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
